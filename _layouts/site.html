*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:#F2F5F8;color:var(--ink);font-family:var(--f-sans);font-size:1.0625rem;line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:#F2F5F8}
a{color:var(--accent-ink)}
button{color:var(--ink)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
main,footer{position:relative;z-index:1}
.wrap{max-width:1200px;margin-inline:auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
section{scroll-margin-top:118px}
.sec{padding-block:clamp(64px,8vw,108px)}
.eyebrow{font-family:var(--f-mono);font-size:.78rem;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink)}
.h2{font-family:var(--f-head);font-weight:var(--h-weight);font-stretch:var(--h-stretch);letter-spacing:var(--h-track);font-size:clamp(2rem,4.2vw,3.05rem);line-height:1.06}
.lede{font-size:1.15rem;color:var(--ink-2);max-width:62ch}
.sec-head{display:grid;gap:14px;margin-bottom:clamp(30px,4vw,48px);max-width:840px}

/* glass */
.glass{background:var(--glass);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 20px 50px -36px var(--shadow);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%)}
.glass-strong{background:var(--glass-strong)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;min-height:48px;padding:0 22px;border-radius:999px;border:1.5px solid transparent;font:600 1rem/1 var(--f-sans);text-decoration:none;white-space:nowrap;cursor:pointer;transition:background-color .15s ease,transform .15s ease,border-color .15s ease}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:var(--accent);color:#FFFFFF;box-shadow:0 10px 24px -12px var(--accent),inset 0 1px 0 rgba(255,255,255,.3)}
.btn-primary:hover{background:var(--accent-hover)}
.btn-ghost{background:#FFFFFF;color:var(--ink);border-color:var(--line-2);box-shadow:0 8px 20px -14px var(--shadow);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.btn-ghost:hover{border-color:var(--line-2)}
.btn-sm{min-height:40px;padding:0 16px;font-size:.92rem}

/* header */
.site-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(255,255,255,.86);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border-bottom:1px solid var(--line);box-shadow:0 8px 24px -20px var(--shadow)}
.head-in{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;column-gap:20px;min-height:66px}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none}
.logo{display:block;flex:none;width:150px;aspect-ratio:607/120;background:var(--ink);-webkit-mask-image:var(--logo);mask-image:var(--logo);-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:left center;mask-position:left center}
.logo-f{width:150px}
.foot-brand{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
@media (max-width:480px){.site-head .logo{width:124px}}
.brand-mark{fill:var(--ink)}
.brand-dot{fill:var(--spark)}
.brand b{display:block;font-family:var(--f-head);font-weight:800;font-size:1.28rem;letter-spacing:.14em;line-height:1.1}
.brand small{display:block;font-family:var(--f-mono);font-size:.64rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.nav{display:flex;align-items:center;gap:14px}
.head-contact{font-size:.88rem;color:var(--ink-2);text-decoration:none;font-weight:500}
.head-contact:hover{color:var(--ink)}
.tabsbar{border-top:1px solid var(--line)}
.tabsbar-in{display:flex;flex:1 1 auto;justify-content:flex-end;gap:2px;overflow-x:auto;scrollbar-width:none}
@media (max-width:980px){.tabsbar-in{order:3;flex:1 0 100%;justify-content:flex-start;padding-block:6px;border-top:1px solid var(--line)}}
.tabsbar-in::-webkit-scrollbar{display:none}
.tb{flex:none;padding:7px 13px;border-radius:999px;color:var(--ink-2);font-size:.88rem;font-weight:500;text-decoration:none;white-space:nowrap}
.tb:hover{background:var(--bg-3);color:var(--ink)}
.tb[aria-current="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
@media (max-width:700px){.head-contact{display:none}.head-contact.head-blog{display:inline}}
@media (max-width:480px){.brand small{display:none}.tabsbar-in{gap:0}.tb{padding:7px 8px;font-size:.82rem}}

/* hero */
.hero{padding-block:clamp(44px,6vw,80px) clamp(56px,7vw,92px)}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(28px,4vw,56px);align-items:center}
.hero-copy{display:grid;gap:22px;align-content:start}
.pill{justify-self:start;display:inline-flex;align-items:center;gap:10px;padding:7px 14px 7px 10px;border-radius:999px;font-size:.9rem;font-weight:500;color:var(--ink-2)}
.pill svg{flex:none;color:var(--accent-ink)}
.hero h1{font-family:var(--f-head);font-weight:800;font-stretch:var(--h-stretch);letter-spacing:calc(var(--h-track) - 0.01em);font-size:clamp(2.6rem,5.6vw,4.6rem);line-height:1.02}
.hero h1 span{display:block;color:var(--accent-ink)}
.hero .lede{font-size:clamp(1.06rem,1.5vw,1.2rem);max-width:56ch}
.cta-row{display:flex;flex-wrap:wrap;gap:12px}
.facts{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:.92rem;color:var(--ink-3)}
.facts span{display:inline-flex;align-items:center;gap:8px}
.facts span::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--spark)}
@media (max-width:960px){.hero-grid{grid-template-columns:minmax(0,1fr)}}

/* hero visuals: three floating options */
.hv{position:relative;min-width:0;container-type:inline-size}
.hv-v{min-width:0}
.hvf-svg{display:block;width:100%;height:auto;overflow:visible}
.hvf-svg.tall{display:none;max-width:420px;margin-inline:auto}
@container (max-width:479px){.hvf-svg.wide{display:none}.hvf-svg.tall{display:block}}
.hvf .trk{fill:none;stroke:var(--accent);stroke-opacity:.12;stroke-width:18;stroke-linecap:round;stroke-linejoin:round}
.hvf .trk.b{stroke-opacity:.09}
.hvf .trk-z{fill:none;stroke:var(--late);stroke-opacity:.16;stroke-width:18}
.hvf .trk-c{fill:none;stroke:var(--accent);stroke-opacity:.35;stroke-width:1.4;stroke-dasharray:1 7;stroke-linecap:round}
.hvf .trk-rw{fill:none;stroke:var(--warn);stroke-opacity:.45;stroke-width:1.6;stroke-dasharray:4 4}
.hvf .rt{fill:none;stroke:none}
.hvf .rwl{font-family:var(--f-sans);font-size:10.5px;fill:var(--warn)}
.hvf .tok rect{fill:var(--accent);transition:fill .5s ease}
.hvf .tok text{font-family:var(--f-sans);font-size:9.6px;font-weight:600;fill:#FFFFFF;letter-spacing:.02em}
.hvf .tok.w rect{fill:var(--late)}
.hvf .tok.rw rect{fill:var(--warn)}
.hvf .st rect{fill:#FFFFFF;stroke:var(--line);stroke-width:1}
.hvf .st.end rect{fill:var(--accent-soft);stroke:color-mix(in srgb,var(--accent) 35%,transparent)}
.hvf .st.bn rect{fill:#FFF4F2;stroke:var(--late);stroke-width:1.6}
.hvf .st.ok rect{fill:#F1FAF4;stroke:#9ED2B3;stroke-width:1.3}
.hvf .st .nm{font-family:var(--f-sans);font-size:13px;font-weight:600;fill:var(--ink)}
.hvf .st .sb{font-family:var(--f-sans);font-size:10.5px;fill:var(--ink-3)}
.hvf .st.bn .nm,.hvf .st.bn .sb{fill:var(--late)}
.hvf .st.ok .sb{fill:var(--ok)}
.hvf .badge rect{fill:var(--late)}
.hvf .badge circle{fill:#FFFFFF;animation:hvblink 2.4s ease-in-out infinite}
.hvf .badge text{font-family:var(--f-sans);font-size:10.5px;font-weight:600;fill:#FFFFFF}
@keyframes hvblink{50%{opacity:.35}}
.hvf .kp rect,.hvf .note rect{fill:#FFFFFF}
.hvf .kp .k{font-family:var(--f-sans);font-size:10.5px;fill:var(--ink-3)}
.hvf .kp .v{font-family:var(--f-head);font-size:18px;font-weight:700;fill:var(--ink)}
.hvf .kp.red .v{fill:var(--late)}
.hvf .kp.green .v{fill:var(--ok)}
.hvf .note text{font-family:var(--f-sans);font-size:12.5px;font-weight:600;fill:var(--ink)}
.hvf .call rect{fill:#FFFFFF;stroke:#F2B9B2}
.hvf .call .k{font-family:var(--f-sans);font-size:9.5px;font-weight:700;letter-spacing:.12em;fill:var(--late)}
.hvf .call .t{font-family:var(--f-head);font-size:14.5px;font-weight:700;fill:var(--ink)}
.hvf .call .s{font-family:var(--f-sans);font-size:11.5px;fill:var(--ink-2)}
.hvf .conn{fill:none;stroke:var(--late);stroke-opacity:.5;stroke-width:1.3;stroke-dasharray:3 4}
.hvf .fl{animation:hvfloat 7s ease-in-out infinite}
.hvf .fl2{animation-delay:-2.3s}.hvf .fl3{animation-delay:-4.6s}
@keyframes hvfloat{50%{transform:translateY(-5px)}}
.hvf .spoke{stroke:var(--accent);stroke-opacity:.16;stroke-width:1.2;stroke-dasharray:2 5}
.hvf .pk circle{fill:var(--accent)}
.hvf .hub-c{fill:#FFFFFF}
.hvf .hub-ring{fill:var(--accent-soft);opacity:.7;transform-box:fill-box;transform-origin:center;transition:transform .5s cubic-bezier(.3,.7,.2,1)}
.hvf .hub.bump .hub-ring{transform:scale(1.06)}
.hvf .hk{font-family:var(--f-sans);font-size:9.5px;font-weight:700;letter-spacing:.14em;fill:var(--accent-ink)}
.hvf .hcount{font-family:var(--f-head);font-size:24px;font-weight:700;fill:var(--ink);font-variant-numeric:tabular-nums}
.hvf .hs{font-family:var(--f-sans);font-size:10.5px;fill:var(--ink-3)}
.hvf .hb{font-family:var(--f-sans);font-size:10.5px;font-weight:600;fill:var(--late)}
@media (prefers-reduced-motion:reduce){.hvf .badge circle,.hvf .fl{animation:none}}

/* before / after */
.ba-card{margin-top:clamp(40px,5vw,64px);border:1px solid var(--line);border-radius:18px;background:var(--bg);box-shadow:0 40px 80px -48px var(--shadow),0 2px 6px rgba(11,30,54,.05);overflow:hidden}
.ba-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.ba-hint{font-size:.92rem;color:var(--ink-2)}
.ba-hint b{color:var(--ink)}
.seg{display:inline-flex;gap:2px;padding:4px;border-radius:999px;background:var(--bg-3)}
.seg button{min-height:36px;padding:0 16px;border:0;border-radius:999px;background:transparent;color:var(--ink-2);font:600 .9rem/1 var(--f-sans);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--ink);box-shadow:0 1px 3px rgba(11,30,54,.18)}
.ba{position:relative;height:660px;--pos:55%;user-select:none;-webkit-user-select:none}
.ba-layer{position:absolute;inset:0;overflow:hidden}
.ba-before{clip-path:inset(0 calc(100% - var(--pos)) 0 0);background:#E7EAEE}
.ba.anim .ba-before{transition:clip-path .9s cubic-bezier(.65,.05,.25,1)}
.ba.anim .ba-handle{transition:left .9s cubic-bezier(.65,.05,.25,1)}
.ba-tag{position:absolute;top:12px;z-index:2;padding:6px 11px;border-radius:999px;font:600 .72rem/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase}
.ba-before .ba-tag{left:14px;background:#FFFFFF;color:#2A2F36;border:1px solid #C9CED6}
.ba-after .ba-tag{right:14px;background:#0F1F3A;color:#FFFFFF}
.ba-range{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:ew-resize;z-index:5;-webkit-appearance:none;appearance:none}
.ba-handle{position:absolute;top:0;bottom:0;left:var(--pos);z-index:4;pointer-events:none}
.ba-handle::before{content:"";position:absolute;top:0;bottom:0;left:-1.5px;width:3px;background:#FFFFFF;box-shadow:0 0 0 1px rgba(11,30,54,.2)}
.knob{position:absolute;top:50%;left:0;display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--accent);color:#FFFFFF;transform:translate(-50%,-50%);box-shadow:0 8px 20px -6px var(--shadow),0 0 0 4px #FFFFFF}
.ba-range:focus-visible + .ba-handle .knob{outline:3px solid var(--accent);outline-offset:5px}
.ba-note{padding:10px 16px;border-top:1px solid var(--line);font-size:.84rem;color:var(--ink-3)}

/* today: chats, spreadsheets, calls (fixed colours, they show other apps) */
.mess{position:absolute;inset:0;padding:52px 22px 20px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:18px;align-items:start;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#1F2328}
.chat{border-radius:14px;overflow:hidden;background:#EEF1EC;box-shadow:0 18px 36px -22px rgba(0,0,0,.45);transform:rotate(-1deg)}
.chat-top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#2E6B57;color:#FFFFFF}
.chat-top i{flex:none;width:30px;height:30px;border-radius:50%;background:#7FB7A2}
.chat-top b{display:block;font-size:.92rem}
.chat-top small{display:block;font-size:.74rem;opacity:.85}
.chat-body{display:grid;gap:6px;padding:10px 12px}
.msg{max-width:88%;padding:6px 10px 5px;border-radius:10px;background:#FFFFFF;font-size:.84rem;line-height:1.32;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.msg b{display:block;font-size:.74rem}
.msg.me{justify-self:end;background:#D9F2CF}
.msg .t{display:block;text-align:right;font-size:.66rem;color:#6B7280}
.n1{color:#B45309}.n2{color:#7C3AED}.n3{color:#0E7490}.n4{color:#BE185D}
.right-stack{display:grid;gap:14px}
.xl{border-radius:10px;overflow:hidden;background:#FFFFFF;box-shadow:0 18px 36px -22px rgba(0,0,0,.45);transform:rotate(1deg)}
.xl-top{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#1F7A45;color:#FFFFFF;font-size:.8rem;font-weight:600}
.xl-tabs{display:flex;gap:2px;padding:4px 8px 0;background:#F1F3F4;font-size:.7rem}
.xl-tabs span{padding:3px 8px;border-radius:4px 4px 0 0;background:#E2E5E8;color:#4B5563}
.xl-tabs span.on{background:#FFFFFF;color:#111827;font-weight:600}
table.grid{width:100%;border-collapse:collapse;table-layout:fixed;font-size:.76rem}
.grid th{padding:3px 5px;border:1px solid #E5E7EB;background:#F3F4F6;color:#6B7280;font-weight:500;text-align:left}
.grid td{padding:4px 5px;border:1px solid #E5E7EB;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid td.red{background:#FDE2E1;color:#9B1C1C;font-weight:600}
.grid td.yel{background:#FEF3C7}
.grid td.err{color:#B91C1C;font-family:ui-monospace,monospace}
.xl-note{width:max-content;max-width:90%;margin:6px 8px 8px auto;padding:5px 9px;border-radius:6px;background:#FEF3C7;border:1px solid #F5D46B;font-size:.74rem}
.calls{display:grid;gap:8px}
.call{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:center;padding:9px 12px;border-radius:12px;background:rgba(255,255,255,.92);box-shadow:0 10px 24px -16px rgba(0,0,0,.45);font-size:.84rem}
.call i{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#FDE2E1;color:#B91C1C;font-style:normal}
.call b{display:block}
.frustration{position:absolute;right:22px;bottom:16px;padding:7px 12px;border-radius:999px;background:#1F2328;color:#FFFFFF;font-size:.8rem;font-weight:600}

/* with athena: copy of the real Traceability screen, in the product's own colours */
.rt{position:absolute;inset:0;display:grid;grid-template-columns:200px minmax(0,1fr);padding-top:0;background:#F3F5F8;font-family:"IBM Plex Sans",system-ui,sans-serif;color:#0F172A}
.rt-side{display:grid;gap:1px;align-content:start;padding:14px 10px;border-right:1px solid #E2E8F0;background:#F7F8FA;font-size:.8rem}
.rt-title{display:flex;align-items:center;gap:9px;padding:2px 6px 12px;font-weight:700;font-size:.92rem}
.rt-title i{display:grid;place-items:center;flex:none;width:28px;height:28px;border-radius:7px;background:#3B6FE0;color:#FFFFFF}
.rt-side span{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 8px;border-radius:7px;color:#1E293B;font-weight:500}
.rt-side span small{font-size:.66rem;color:#64748B}
.rt-side span em{font-style:normal;display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#FEE2E2;color:#DC2626;font-size:.66rem;font-weight:700}
.rt-side hr{margin:6px 4px;border:0;border-top:1px solid #E2E8F0}
.rt-side span.on{background:#FFFFFF;box-shadow:0 1px 3px rgba(15,23,42,.12);font-weight:700}
.rt-main{display:grid;gap:10px;align-content:start;padding:46px 16px 14px;min-width:0}
.rt-card{border:1px solid #E2E8F0;border-radius:10px;background:#FFFFFF}
.rt-search{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:end;padding:10px 14px}
.rt-search label{grid-column:1 / -1;font-size:.68rem;font-weight:700;letter-spacing:.06em;color:#1E293B}
.rt-search label b{color:#DC2626}
.rt-input{padding:7px 10px;border:1px solid #E2E8F0;border-radius:7px;background:#F1F4F8;font-size:.86rem;font-weight:500}
.rt-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:7px;background:#2955D6;color:#FFFFFF;font-size:.84rem;font-weight:700}
.rt-info{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px 10px;padding:10px 14px}
.rt-info small{display:block;font-size:.6rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#475569}
.rt-info b{display:block;font-size:.86rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt-hero{overflow:hidden;border-radius:10px;border:1px solid #E2E8F0;background:#FFFFFF}
.rt-banner{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 14px;align-items:center;padding:12px 14px;background:#1F3354;color:#FFFFFF}
.rt-banner h4{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 4px;font-size:1.05rem;font-weight:700}
.rt-urgent{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;background:#E5484D;font-size:.66rem;font-weight:700;letter-spacing:.04em}
.rt-meta{display:flex;flex-wrap:wrap;gap:2px 16px;font-size:.74rem;color:#E2E8F0}
.rt-meta b{color:#FFFFFF}
.rt-stats{display:flex;flex-wrap:wrap;gap:6px}
.rt-stats div{display:grid;gap:1px;min-width:64px;padding:5px 8px;border:1px solid #3B5279;border-radius:7px;background:#2A4166}
.rt-stats small{font-size:.56rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#C6D2E4}
.rt-stats b{font-size:.84rem}
.rt-stats div.neg{border-color:#FCA5A5;background:#FFF1F2}
.rt-stats div.neg small,.rt-stats div.neg b{color:#DC2626}
.rt-wip{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 14px;background:#EEF4FF;border-bottom:1px solid #E2E8F0;font-size:.74rem}
.rt-wip strong{font-size:.68rem;letter-spacing:.06em}
.rt-pill{padding:3px 12px;border-radius:999px;background:#2955D6;color:#FFFFFF;font-weight:700;font-size:.8rem;box-shadow:0 0 0 3px #C9D8FB}
.rt-wip span{color:#475569}
.rt-wip .rt-pill{color:#FFFFFF}
.rt-qty{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:8px 14px;border-bottom:1px solid #E2E8F0;font-size:.8rem;font-weight:600}
.rt-qty i{font-style:normal;display:inline-block;min-width:40px;padding:4px 10px;border:1px solid #E2E8F0;border-radius:6px;background:#F8FAFC;color:#64748B;text-align:center}
.rt-qty u{text-decoration:none;display:inline-block;min-width:90px;padding:4px 10px;border:1px solid #CBD5E1;border-radius:6px}
.rt-qty b{color:#DC2626}
.rt-stages{padding:10px 14px 12px}
.rt-stages > small{display:block;margin-bottom:8px;font-size:.66rem;font-weight:700;letter-spacing:.06em;color:#1E293B}
.rt-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}
.ps{display:grid;gap:3px;align-content:start;padding:7px 8px;border:1.5px solid #BBE5C8;border-radius:8px;background:#F0FBF3;color:#15803D;font-size:.78rem;line-height:1.2}
.ps .pc{display:flex;align-items:center;gap:5px;font-size:.66rem;font-weight:700}
.ps .pc i{font-style:normal;padding:1px 6px;border-radius:999px;background:#D7F2DF}
.ps b{font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ps .d{font-size:.66rem;font-weight:600;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.ps .tg{padding:1px 5px;border-radius:4px;font-size:.6rem;font-weight:700}
.tg.late{background:#FEE2E2;color:#DC2626}
.tg.early{background:#DBEAFE;color:#1D4ED8}
.ps .q{justify-self:start;padding:1px 7px;border-radius:999px;background:#EEF2FF;color:#3730A3;font-size:.64rem;font-weight:700}
.ps.late{border-color:#F7B2B2;background:#FEF2F2;color:#B91C1C}
.ps.late .pc i{background:#FDE0E0}
.ps.cur{border-color:#2C55D0;background:#2C55D0;color:#FFFFFF;box-shadow:0 0 0 3px #C9D8FB}
.ps.cur .pc i{background:rgba(255,255,255,.22)}
.ps.cur .q{background:#FFFFFF;color:#2C55D0}
.ps.cur .d{color:#FECACA}
.ps.pend{border-color:#E2E8F0;background:#FFFFFF;color:#94A3B8}
.ps.pend b{color:#64748B}
.ps.pend .pc i{background:#F1F5F9}
@media (max-width:1100px){.rt{grid-template-columns:minmax(0,1fr)}.rt-side{display:none}}
@media (max-width:1000px){
  .ba{height:680px}

  .rt-info{grid-template-columns:repeat(4,minmax(0,1fr))}
  .rt-info .x-md{display:none}

}

  .ba{height:760px}
  .mess{grid-template-columns:minmax(0,1fr);padding:50px 14px 14px}
  .right-stack .xl,.hide-sm{display:none}
  .rt-main{padding:46px 10px 10px;gap:8px}
  .rt-info{grid-template-columns:repeat(2,minmax(0,1fr))}

.ba-card{background:var(--glass-strong);border:1px solid var(--glass-border);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%)}
.ba-bar,.ba-note{border-color:rgba(193,211,223,.6)}
.seg{background:var(--bg-3);border:1px solid var(--line)}

/* usp strip */
.strip{margin-top:clamp(36px,5vw,56px);border-radius:999px;padding:14px 22px}
.strip-in{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px 28px}
.strip-in span{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:.93rem;color:var(--ink-2)}
.strip-in svg{flex:none;color:var(--accent-ink)}
@media (max-width:700px){.strip{border-radius:20px}}

/* plan vs reality: two lines, the plan and the floor */
.pf{display:grid;grid-template-columns:104px repeat(7,minmax(0,1fr)) 84px;padding:clamp(18px,2.8vw,32px) clamp(16px,2.4vw,28px);border-radius:24px}
.pf > li{display:grid;grid-template-rows:40px 44px 44px minmax(42px,auto);align-items:center;min-width:0}
.pf-lab b,.pf-end b{font-size:.76rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.pf-lab b.fl{color:var(--accent-ink)}
.pf-end b{padding-left:14px;font-size:.98rem;letter-spacing:0;text-transform:none;color:var(--ink-2)}
.pf-end b.late{color:var(--late)}
.pf-st .nm{align-self:end;padding:0 4px 8px;text-align:center;font-size:.88rem;font-weight:600;line-height:1.2;color:var(--ink)}
.pf-st .p,.pf-st .f{position:relative;display:grid;place-items:center;height:100%}
.pf-st .p::before,.pf-st .f::before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:var(--line-2)}
.pf-st .f::before{height:3px;margin-top:-1.5px;background:color-mix(in srgb,var(--accent) 45%,#FFFFFF)}
.pf-st:nth-child(2) .p::before,.pf-st:nth-child(2) .f::before{left:50%}
.pf-st:nth-last-child(2) .p::before,.pf-st:nth-last-child(2) .f::before{right:50%}
.pf-st i{position:relative;z-index:1;display:block;border-radius:50%}
.pf-st .p i{width:12px;height:12px;background:#FFFFFF;border:2px solid var(--line-2)}
.pf-st .f i{width:14px;height:14px;background:var(--accent);box-shadow:0 0 0 3px #FFFFFF}
.pf-st.dv .f i{width:18px;height:18px;background:#FFFFFF;border:3px solid var(--accent);box-shadow:0 0 0 5px var(--accent-soft)}
.pf-st.bad .f i{border-color:var(--late);box-shadow:0 0 0 5px var(--late-bg)}
.pf-st .nt{align-self:start;padding:6px 6px 0;text-align:center;font-size:.8rem;font-weight:500;line-height:1.35;color:var(--accent-ink)}
.pf-st.bad .nt{color:var(--late)}
.pf .f i,.pf .nt{transition:opacity .5s ease var(--d,0ms),transform .5s cubic-bezier(.3,.7,.2,1) var(--d,0ms)}
.pf.pre .dv .f i,.pf.pre .nt{opacity:0;transform:scale(.7)}
@media (max-width:760px){
  .pf{grid-template-columns:minmax(0,1fr);padding-block:14px}
  .pf > li{grid-template-rows:none;grid-template-columns:minmax(0,1fr) 74px 74px;grid-template-areas:"nm p f" "nt p f";min-height:58px}
  .pf-lab{min-height:30px !important}
  .pf-lab span,.pf-end span{display:none}
  .pf-lab b,.pf-end b{text-align:center;padding:0;font-size:.66rem}
  .pf-lab b{grid-area:p}.pf-lab b.fl{grid-area:f}
  .pf-end{min-height:40px !important}
  .pf-end b{grid-area:p;font-size:.9rem}.pf-end b.late{grid-area:f}
  .pf-st .nm{grid-area:nm;text-align:left;padding:8px 0 0}
  .pf-st .nt{grid-area:nt;text-align:left;padding:2px 0 8px}
  .pf-st .p{grid-area:p}.pf-st .f{grid-area:f}
  .pf-st .p::before,.pf-st .f::before{left:50%;right:auto;top:0;bottom:0;width:2px;height:auto;margin:0 0 0 -1px}
  .pf-st .f::before{width:3px;margin-left:-1.5px}
  .pf-st:nth-child(2) .p::before,.pf-st:nth-child(2) .f::before{left:50%;top:50%}
  .pf-st:nth-last-child(2) .p::before,.pf-st:nth-last-child(2) .f::before{right:auto;bottom:50%}
}

/* ask three systems: table */
.qt-wrap{overflow-x:auto;border-radius:20px}
table.qt{width:100%;min-width:860px;border-collapse:separate;border-spacing:0}
.qt th,.qt td{padding:16px 18px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.qt thead th{position:relative;font-size:.92rem;font-weight:600;color:var(--ink-2);background:var(--bg-2)}
.qt thead th small{display:block;font-weight:400;font-size:.8rem;color:var(--ink-3)}
.qt thead th.us{background:var(--accent);color:#FFFFFF}
.qt thead th.us small{color:rgba(255,255,255,.82)}
.qt tbody th{width:22%;font-weight:600;font-size:.98rem;color:var(--ink)}
.qt td{width:23%;font-size:.95rem;color:var(--ink-2)}
.qt td.us{width:32%;background:var(--accent-soft);color:var(--ink);font-weight:500}

.mk.n path{stroke:var(--ink-3);stroke-width:2;stroke-linecap:round}
.mk.i circle{fill:#FFFFFF;stroke:var(--ink-3);stroke-width:1.4}

.ft-key{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:12px;font-size:.84rem;color:var(--ink-3)}

/* differentiator explorer */
.dx{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,7fr);gap:18px;align-items:start}
.dx-list{display:grid;gap:8px}
.dx-list button{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:center;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:#FFFFFF;color:var(--ink);font:inherit;text-align:left;cursor:pointer;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:background-color .2s ease,border-color .2s ease}
.dx-list button span{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--bg-3);font:600 .8rem/1 var(--f-mono);color:var(--ink-3)}
.dx-list button b{display:block;font-size:.98rem;line-height:1.25}
.dx-list button small{display:block;font-size:.84rem;color:var(--ink-2)}
.dx-list button[aria-selected="true"]{background:var(--accent-soft);border-color:var(--accent);box-shadow:0 14px 30px -24px var(--accent)}
.dx-list button[aria-selected="true"] span{background:var(--accent);color:#FFFFFF}
.dx-stage{min-height:440px;padding:clamp(18px,2.6vw,30px);border-radius:24px}
.dx-pane{display:grid;gap:16px;animation:evIn .45s ease both}
.dx-pane h3{font-family:var(--f-head);font-weight:var(--h-weight);font-stretch:var(--h-stretch);letter-spacing:var(--h-track);font-size:clamp(1.5rem,2.4vw,2rem);line-height:1.12}
.dx-pane > p{color:var(--ink-2);max-width:58ch}
.tile{padding:14px 16px;border-radius:16px;background:#FFFFFF;border:1px solid var(--line)}
.roles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.role{display:grid;gap:8px}
.role i{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);font:700 .9rem/1 var(--f-sans);font-style:normal}
.role b{font-size:.95rem}
.role p{font-size:.92rem;color:var(--ink-2)}
.mini-route{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.mini-route span{padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.8);border:1px solid var(--line);font-size:.86rem;font-weight:600}
.mini-route span.var{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}
.mini-route span.bad{border-color:var(--late);color:var(--late);background:var(--late-bg)}
.mini-route em{font-style:normal;color:var(--ink-3)}
.gen{display:grid;gap:14px}
.gen-top{justify-self:center;padding:12px 18px;border-radius:14px;background:var(--ink);color:#FFFFFF;text-align:center}
.gen-top b{display:block}
.gen-top small{font-family:var(--f-mono);font-size:.76rem;opacity:.8}
.gen-kids{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding-top:16px}
.gen-kids::before{content:"";position:absolute;top:0;left:12.5%;right:12.5%;height:16px;border:2px solid var(--line-2);border-bottom:0;border-radius:10px 10px 0 0}
.gen-kids button{display:grid;gap:2px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line-2);background:#FFFFFF;color:var(--ink);font:inherit;text-align:left;cursor:pointer;transition:border-color .2s ease,background-color .2s ease}
.gen-kids button:hover{border-color:var(--accent)}
.gen-kids button b{font-size:.9rem;line-height:1.25;color:var(--ink)}
.gen-kids button small{font-family:var(--f-mono);font-size:.72rem;color:var(--ink-3)}
.gen-kids button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.gen-kids button[aria-pressed="true"] b{color:var(--accent-ink)}
.gen-kids button[aria-pressed="true"] small{color:var(--ink-2)}
.gen-detail{font-size:.95rem;color:var(--ink-2)}
.gen-detail b{color:var(--ink)}
.plans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.plans .tile b{display:block;font-size:1rem}
.plans .tile small{display:block;font-size:.88rem;color:var(--ink-2)}
.plans .tile em{display:inline-block;margin-top:8px;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink);font:600 .72rem/1.3 var(--f-mono);font-style:normal}
.steps3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}

.steps3 span{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#FFFFFF;font:600 .8rem/1 var(--f-mono)}
.steps3 b{font-size:1rem}
.steps3 small{font-size:.9rem;color:var(--ink-2)}
.zone{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:12px;align-items:center}
.zone-pc{display:grid;gap:6px;justify-items:center;padding:20px;text-align:center}
.zone-pc svg{color:var(--accent-ink)}
.zone-pc b{font-size:1rem}
.zone-pc small{font-size:.86rem;color:var(--ink-3)}
.zone-m{display:grid;gap:8px}
.zone-m span{display:flex;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.8);border:1px dashed var(--line-2);font-size:.88rem}
.zone-m span b{font-family:var(--f-mono)}
.zone-m span em{font-style:normal;color:var(--ink-3)}
.cfg{display:grid;gap:8px}
.sw-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.95)}
.sw-row b{display:block;font-size:.95rem}
.sw-row small{display:block;font-size:.85rem;color:var(--ink-3)}
.switch{position:relative;width:48px;height:28px;border:0;border-radius:999px;background:var(--line-2);cursor:pointer;transition:background-color .2s ease}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#FFFFFF;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s ease}
.switch[aria-checked="true"]{background:var(--accent)}

@media (max-width:900px){.dx{grid-template-columns:minmax(0,1fr)}.dx-list{grid-template-columns:repeat(2,minmax(0,1fr))}.dx-stage{min-height:0}}
@media (max-width:600px){.dx-list{grid-template-columns:minmax(0,1fr)}.roles,.plans,.zone,.steps3{grid-template-columns:minmax(0,1fr)}.gen-kids{grid-template-columns:repeat(2,minmax(0,1fr))}.gen-kids::before{display:none}}

/* demo modules */
.mods{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.mod{display:grid;grid-template-rows:auto auto 1fr auto;gap:10px;padding:18px;border-radius:18px;transition:border-color .2s ease,box-shadow .2s ease}
.mod .num{font-family:var(--f-mono);font-size:.74rem;color:var(--ink-3)}
.mod h3{font-family:var(--f-head);font-stretch:var(--h-stretch);font-size:1.02rem;font-weight:700;letter-spacing:-0.01em;line-height:1.25}
.mod p{font-size:.9rem;color:var(--ink-2)}
.mod button{justify-self:start;display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:0 14px;border:1px solid var(--line-2);border-radius:999px;background:rgba(255,255,255,.85);color:var(--ink);font:600 .84rem/1 var(--f-sans);cursor:pointer}
.mod button::before{content:"+";font-weight:700;color:var(--accent-ink)}
.mod button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:#FFFFFF}
.mod button[aria-pressed="true"]::before{content:"\2713";color:#FFFFFF}
.mod.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 24px 50px -34px var(--accent)}
.mods-cta{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;margin-top:18px;padding:16px 22px;border-radius:999px}

.mods-cta b{color:var(--ink)}
@media (max-width:1100px){.mods{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:760px){.mods{grid-template-columns:repeat(2,minmax(0,1fr))}.mods-cta{border-radius:20px}}
@media (max-width:480px){.mods{grid-template-columns:minmax(0,1fr)}}

/* way of work */
.way{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;counter-reset:w}
.way li{display:grid;gap:10px;align-content:start;padding:22px 18px;border-radius:18px;counter-increment:w}
.way li::before{content:counter(w);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--accent);color:#FFFFFF;font:600 .9rem/1 var(--f-mono)}
.way h3{font-family:var(--f-head);font-stretch:var(--h-stretch);font-size:1.06rem;font-weight:700}
.way p{font-size:.93rem;color:var(--ink-2)}
.way-note{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;margin-top:18px;padding:18px 24px;border-radius:999px}
.way-note p{max-width:64ch;color:var(--ink-2)}
.way-note b{color:var(--ink)}
@media (max-width:1000px){.way{grid-template-columns:repeat(2,minmax(0,1fr))}.way li:last-child{grid-column:1 / -1}.way-note{border-radius:20px}}
@media (max-width:560px){.way{grid-template-columns:minmax(0,1fr)}}

/* demo form */
.apply{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,4fr);gap:clamp(24px,4vw,48px);align-items:start}
.form{display:grid;gap:16px;padding:clamp(20px,3vw,32px);border-radius:24px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.field{display:grid;gap:6px;min-width:0}
.field.full{grid-column:1 / -1}
.field label,.field legend{font-weight:600;font-size:.92rem}
.field label small{font-weight:400;color:var(--ink-3)}
.field input,.field select,.field textarea{width:100%;min-width:0;padding:11px 12px;border:1px solid var(--line-2);border-radius:10px;background:rgba(255,255,255,.85);color:var(--ink);font:inherit;font-size:1rem}
.field textarea{min-height:90px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.field [aria-invalid="true"]{border-color:var(--late)}
fieldset.field{margin:0;padding:0;border:0}
.checks{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.checks label{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border:1px solid var(--line-2);border-radius:999px;background:rgba(255,255,255,.7);font-weight:500;font-size:.88rem;cursor:pointer}
.checks input{width:auto;accent-color:var(--accent)}
.checks label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.err{font-size:.82rem;color:var(--late)}
.form-foot{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.form-foot p{font-size:.85rem;color:var(--ink-3)}
.ready{display:grid;gap:12px;padding:16px;border:1.5px solid var(--accent);border-radius:14px;background:var(--accent-soft)}
.ready h3{font-size:1.1rem}
.ready pre{margin:0;max-height:260px;overflow:auto;padding:12px;border:1px solid var(--line);border-radius:10px;background:#FFFFFF;font-family:var(--f-mono);font-size:.82rem;white-space:pre-wrap;overflow-wrap:anywhere}
.ready .row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.ready .note{font-size:.86rem;color:var(--ink-2)}
.next-steps{display:grid;gap:18px;padding:24px;border-radius:24px}
.next-steps ol{display:grid;gap:16px;counter-reset:n}
.next-steps li{display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;counter-increment:n}
.next-steps li::before{content:counter(n);display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);font:600 .85rem/1 var(--f-mono)}
.next-steps p{font-size:.95rem;color:var(--ink-2)}
@media (max-width:900px){.apply{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.fgrid{grid-template-columns:minmax(0,1fr)}}

/* faq */
.faq{display:grid;max-width:900px;padding:8px 24px;border-radius:24px}

.cx{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:stretch}

.cx-list{display:grid}
.cx-row{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.cx-row:first-child{border-top:0}
.cx-ic{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--accent-soft);color:var(--accent-ink)}

.cx-v{flex:1;min-width:0;display:grid;gap:1px}

.cx-acts{flex:none;display:inline-flex;flex-wrap:wrap;justify-content:flex-end;gap:6px}
.cx-btn{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 13px;border:1px solid var(--line-2);border-radius:999px;background:#FFFFFF;color:var(--ink);font:600 .82rem/1 var(--f-sans);text-decoration:none;cursor:pointer;transition:border-color .15s ease,background-color .15s ease}

.cx-k{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.8)}
.cx-cta h3{font-family:var(--f-head);font-weight:var(--h-weight);letter-spacing:var(--h-track);font-size:clamp(1.45rem,2.4vw,1.9rem);line-height:1.15;color:#FFFFFF}
.cx-cta p:not(.cx-k){color:rgba(255,255,255,.88);max-width:44ch}
.cx-cta-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.cx-light{background:#FFFFFF;color:var(--accent-ink)}
.cx-light:hover{background:#F4F7FA}
.cx-outline{background:transparent;color:#FFFFFF;border-color:rgba(255,255,255,.55)}
.cx-outline:hover{border-color:#FFFFFF}
.cx-outline svg{width:18px;height:18px}
.cx-outline svg path:first-child{fill:none;stroke:currentColor;stroke-width:1.5;stroke-linejoin:round}

@media (max-width:900px){.cx{grid-template-columns:minmax(0,1fr)}}
@media (max-width:480px){.cx-row{flex-wrap:wrap}.cx-acts{width:100%;justify-content:flex-start;padding-left:52px}}
.foot-ct{font-family:var(--f-mono);font-size:.82rem}

.end{padding-block:8px 64px}
.nmtg{display:block;width:min(360px,82%);aspect-ratio:936/48;margin-inline:auto;background:var(--ink-2);-webkit-mask-image:var(--nmtg);mask-image:var(--nmtg);-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}

.cx-link{color:inherit;text-decoration:none}

[hidden]{display:none!important}
body{margin:0}
img{max-width:100%}
/* explore cards (home) and the closing demo band (inner pages) */
.ex-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.ex{display:grid;gap:8px;align-content:start;padding:22px;border-radius:22px;color:inherit;text-decoration:none;transition:transform .2s ease,border-color .2s ease}

<script>
(function(){
  /* Contact details: fill these in before launch. Empty values show a red placeholder. */
  var CONTACT = {
    name: "Aanshi Panchal",
    phone1: "+91 97263 71660",
    phone2: "+91 99246 53110",
    email: "athena@nmtgindia.com",
    address: "",                       /* empty: the address card stays hidden */
    hours: "9:00 AM to 6:30 PM (IST)"
  };
  var PH = {name:"[Add contact name]", phone1:"[Add phone number]", phone2:"", email:"[Add email address]", address:"", hours:"[Add working hours]"};
  function waNum(v){ return (v || "").replace(/\D/g, ""); }
  var WHATSAPP_NUMBER = waNum(CONTACT.phone1);   /* demo requests go to this number */
  var reduce = false;
  try { reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch(e) {}
  function $(s){ return document.querySelector(s); }
  function $$(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); }
  function store(k, v){ try { localStorage.setItem(k, v); } catch(e) {} }
  function load(k){ try { return localStorage.getItem(k); } catch(e) { return null; } }

  /* ---------- Contact ---------- */
  $$("[data-c]").forEach(function(el){
    var k = el.getAttribute("data-c"), v = CONTACT[k];
    el.textContent = v || PH[k];
    if (!v && el.tagName === "B") el.classList.add("ph");
  });
  $$("[data-initials]").forEach(function(el){
    el.textContent = (CONTACT[el.getAttribute("data-initials")] || "").split(/\s+/).map(function(w){ return w.charAt(0); }).join("").slice(0, 2).toUpperCase();
  });
  $$("[data-hide-empty]").forEach(function(el){ if (!CONTACT[el.getAttribute("data-hide-empty")]) el.hidden = true; });
  $$("[data-wa]").forEach(function(a){
    var n = waNum(CONTACT[a.getAttribute("data-wa")]);
    if (n) a.href = "https://wa.me/" + n; else a.hidden = true;
  });
  $$("[data-copy]").forEach(function(btn){
    var k = btn.getAttribute("data-copy");
    if (!CONTACT[k]) { btn.hidden = true; return; }
    btn.addEventListener("click", function(){
      var done = function(){ btn.textContent = "Copied"; setTimeout(function(){ btn.textContent = "Copy"; }, 1600); };
      try { navigator.clipboard.writeText(CONTACT[k]).then(done, function(){ btn.textContent = "Select and copy"; }); } catch(e) { btn.textContent = "Select and copy"; }
    });
  });

  /* ---------- Hero animation: job cards split between two vendors ---------- */
  (function(){
    var hv = $("#hv"); if (!hv) return;
    var vis = true, cur = null, NS = "http://www.w3.org/2000/svg", raf = null, flows = {};
    if ("IntersectionObserver" in window){ new IntersectionObserver(function(en){ vis = en[0].isIntersecting; }).observe(hv); }
    function mk(tag, attrs){ var e = document.createElementNS(NS, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); return e; }
    function Flow(svg){
      var g = svg.querySelector(".toks"), pk = svg.querySelector(".pk"), hubA = svg.getAttribute("data-hub"), routes = [], packets = [], lastEmit = 0;
      var hub = hubA ? hubA.split(",").map(Number) : null, cnt = svg.querySelector("[data-cnt]"), hubG = svg.querySelector(".hub");
      var stp = hub ? Array.prototype.map.call(svg.querySelectorAll(".st"), function(s){ return s.getAttribute("data-pt").split(",").map(Number); }) : [];
      Array.prototype.forEach.call(svg.querySelectorAll(".rt"), function(path){
        var L = path.getTotalLength(), zs = path.getAttribute("data-zone"), d0 = null, d1 = null, sd = [];
        if (zs){ var z = zs.split(",").map(Number); for (var d = 0; d <= L; d += 2){ var p = path.getPointAtLength(d); if (p.x >= z[0] && p.x <= z[2] && p.y >= z[1] && p.y <= z[3]){ if (d0 === null) d0 = d; d1 = d; } } }
        if (hub){ stp.forEach(function(c){ var best = null, bd = 1e9; for (var d = 0; d <= L; d += 3){ var p = path.getPointAtLength(d), dd = Math.hypot(p.x - c[0], p.y - c[1]); if (dd < bd){ bd = dd; best = d; } } sd.push(bd < 20 ? best : null); }); }
        var VF = 78, VS = 16, I = +path.getAttribute("data-i") || 3.3, PH = +path.getAttribute("data-ph") || 0, kind = path.getAttribute("data-k") || "";
        if (d0 === null){ d0 = L; d1 = L; }
        var tA = d0 / VF, tB = tA + (d1 - d0) / VS, T = tB + (L - d1) / VF, N = Math.max(1, Math.ceil(T / I)), C = N * I, toks = [];
        for (var k = 0; k < N; k++){
          var t = mk("g", {"class": "tok" + (kind ? " " + kind : "")}); t.style.opacity = "0";
          t.appendChild(mk("rect", {x: kind ? -22 : -25, y: -10, width: kind ? 44 : 50, height: 20, rx: 10}));
          var tx = mk("text", {y: 3.4, "text-anchor": "middle"}); t.appendChild(tx); g.appendChild(t);
          toks.push({g: t, tx: tx, cyc: -1, w: null, last: -1});
        }
        routes.push({path: path, L: L, d0: d0, d1: d1, VF: VF, VS: VS, I: I, PH: PH, tA: tA, tB: tB, T: T, N: N, C: C, toks: toks, kind: kind, sd: sd});
      });
      function emit(i, s){
        if (s - lastEmit < .7 || Math.random() > .5) return; lastEmit = s;
        var c = mk("circle", {r: 3.6, cx: stp[i][0], cy: stp[i][1]}); pk.appendChild(c);
        packets.push({el: c, x0: stp[i][0], y0: stp[i][1], t0: s});
      }
      function step(s){
        routes.forEach(function(r){
          r.toks.forEach(function(o, k){
            var u = s + r.PH + k * r.I, a = u % r.C, cyc = Math.floor(u / r.C);
            if (a > r.T){ o.g.style.opacity = "0"; o.last = -1; return; }
            var dd = a < r.tA ? a * r.VF : a < r.tB ? r.d0 + (a - r.tA) * r.VS : r.d1 + (a - r.tB) * r.VF;
            dd = Math.min(r.L, dd);
            var p = r.path.getPointAtLength(dd);
            o.g.setAttribute("transform", "translate(" + p.x.toFixed(1) + " " + p.y.toFixed(1) + ")");
            o.g.style.opacity = String(Math.max(0, Math.min(1, a / .6, (r.T - a) / .6)));
            var w = !r.kind && r.d1 > r.d0 && dd >= r.d0 - 14 && dd <= r.d1 + 4; if (w !== o.w){ o.w = w; o.g.classList.toggle("w", w); }
            if (cyc !== o.cyc){ o.cyc = cyc; o.tx.textContent = r.kind ? "rework" : "JC " + (4700 + ((cyc * r.N + k) * 7 + Math.round(r.PH * 10)) % 290); }
            if (hub && o.last >= 0){ r.sd.forEach(function(sdv, i){ if (sdv !== null && i > 0 && o.last < sdv && dd >= sdv) emit(i, s); }); }
            o.last = dd;
          });
        });
        if (hub){
          for (var j = packets.length - 1; j >= 0; j--){
            var q = packets[j], t = (s - q.t0) / .9;
            if (t >= 1){ q.el.parentNode.removeChild(q.el); packets.splice(j, 1);
              var n = +cnt.getAttribute("data-cnt") + 1; cnt.setAttribute("data-cnt", n); cnt.textContent = n.toLocaleString("en-IN");
              hubG.classList.add("bump"); setTimeout(function(){ hubG.classList.remove("bump"); }, 260); continue; }
            var e = t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
            q.el.setAttribute("cx", (q.x0 + (hub[0] - q.x0) * e).toFixed(1)); q.el.setAttribute("cy", (q.y0 + (hub[1] - q.y0) * e).toFixed(1));
            q.el.setAttribute("opacity", String(1 - Math.max(0, t - .7) / .3));
          }
        }
      }
      return {svg: svg, step: step};
    }
    function loop(now){
      raf = requestAnimationFrame(loop); if (!vis || !cur) return;
      var s = now / 1000 + 40;
      (flows[cur] || []).forEach(function(f){ if (f.svg.getBoundingClientRect().width > 0) f.step(s); });
    }
    function show(k){
      if (!hv.querySelector('.hv-v[data-v="' + k + '"]')) k = "1";
      $$(".hv-v").forEach(function(v){ v.hidden = v.getAttribute("data-v") !== k; });
      cur = k;
      if (!flows[k]) flows[k] = $$('.hv-v[data-v="' + k + '"] .hvf-svg').map(Flow);
      if (reduce){ flows[k].forEach(function(f){ f.step(52); }); }
      else if (!raf) raf = requestAnimationFrame(loop);
    }
    show("2");
  })();

  /* ---------- Before / after ---------- */
  (function(){
  if (!$("#ba")) return;
  var ba = $("#ba"), range = $("#ba-range");
  var segBtns = $$(".ba-bar .seg button");
  var demoTimers = [];
  function setPos(p, animate){
    ba.classList.toggle("anim", !!animate);
    ba.style.setProperty("--pos", p + "%");
    range.value = p;
    range.setAttribute("aria-valuetext", p >= 95 ? "Showing today" : p <= 5 ? "Showing Athena" : "Comparing both");
    segBtns.forEach(function(b){
      var bp = +b.dataset.pos;
      b.setAttribute("aria-pressed", String((bp === 100 && p >= 95) || (bp === 0 && p <= 5) || (bp === 50 && p > 5 && p < 95)));
    });
  }
  function stopDemo(){ demoTimers.forEach(clearTimeout); demoTimers = []; }
  range.addEventListener("input", function(){ stopDemo(); setPos(+range.value, false); });
  range.addEventListener("pointerdown", stopDemo);
  segBtns.forEach(function(b){ b.addEventListener("click", function(){ stopDemo(); setPos(+b.dataset.pos, !reduce); }); });
  setPos(55, false);
  if (!reduce) [[1200, 80], [2400, 24], [3600, 55]].forEach(function(s){ demoTimers.push(setTimeout(function(){ setPos(s[1], true); }, s[0])); });
  })();

  /* ---------- Plan vs reality: the changes appear once, in order ---------- */
  (function(){
    var pf = $("#pf"); if (!pf || reduce || !("IntersectionObserver" in window)) return;
    pf.classList.add("pre");
    var io = new IntersectionObserver(function(en){ if (en[0].isIntersecting){ pf.classList.remove("pre"); io.disconnect(); } }, {threshold: .4});
    io.observe(pf);
  })();

  /* ---------- Differentiator explorer ---------- */
  (function(){
  if (!$("#dx-list")) return;
  var dxTabs = $$("#dx-list button");
  function dxSel(t, focus){
    dxTabs.forEach(function(x){
      var on = x === t;
      x.setAttribute("aria-selected", String(on)); x.tabIndex = on ? 0 : -1;
      document.getElementById(x.getAttribute("aria-controls")).hidden = !on;
    });
    if (focus) t.focus();
  }
  dxTabs.forEach(function(t, i){
    t.addEventListener("click", function(){ dxSel(t, false); });
    t.addEventListener("keydown", function(e){
      var k = e.key, n = -1;
      if (k === "ArrowDown" || k === "ArrowRight") n = (i + 1) % dxTabs.length;
      if (k === "ArrowUp" || k === "ArrowLeft") n = (i + dxTabs.length - 1) % dxTabs.length;
      if (n >= 0){ e.preventDefault(); dxSel(dxTabs[n], true); }
    });
  });
  var GEN = [
    "<b>Pinion shaft, lot 204718:</b> bar heat no. H-7731 · turned on CNC-04 · hobbed on HB-02 · heat treated by Vendor A, batch HT-1186 · passed quality on 01 Nov.",
    "<b>Helical gear, lot 204730:</b> forging batch F-2207 · turned on CNC-02 · hobbed on HB-03 · heat treated by Vendor A, batch HT-1186 · passed quality on 31 Oct.",
    "<b>Housing, lot 204745:</b> casting batch C-0915 · machined on VMC-01 · 1 piece reworked after inspection · passed quality on 30 Oct.",
    "<b>Cover plate, lot 204752:</b> plate heat no. P-5520 · machined on VMC-02 · passed quality on 29 Oct."
  ];
  var gBtns = $$("#gen-kids button");
  gBtns.forEach(function(b){
    b.addEventListener("click", function(){
      gBtns.forEach(function(x){ x.setAttribute("aria-pressed", String(x === b)); });
      $("#gen-detail").innerHTML = GEN[+b.dataset.g];
    });
  });
  var sws = $$(".switch");
  function cfgNote(){ var on = sws.filter(function(s){ return s.getAttribute("aria-checked") === "true"; }).length; $("#cfg-note").textContent = on + " of " + sws.length + " settings on. Change them any time."; }
  sws.forEach(function(s){ s.addEventListener("click", function(){ s.setAttribute("aria-checked", String(s.getAttribute("aria-checked") !== "true")); cfgNote(); }); });
  cfgNote();
  })();

  /* ---------- Demo modules: picked on the Modules page, carried to the demo form ---------- */
  var checks = $$("#see-checks input");
  (function(){
    var KEY = "athena-see", modBtns = $$(".mod button"), countEl = $("#mods-count");
    function saved(){ try { return JSON.parse(localStorage.getItem(KEY) || "[]"); } catch(e) { return []; } }
    function save(a){ try { localStorage.setItem(KEY, JSON.stringify(a)); } catch(e) {} }
    var mem = saved();
    if (checks.length) checks.forEach(function(c){ if (mem.indexOf(c.value) >= 0) c.checked = true; });
    function picked(){ return checks.length ? checks.filter(function(c){ return c.checked; }).map(function(c){ return c.value; }) : mem; }
    function sync(){
      var p = picked(); mem = p; save(p);
      modBtns.forEach(function(b){
        var on = p.indexOf(b.dataset.see) >= 0;
        b.setAttribute("aria-pressed", String(on));
        b.textContent = on ? "In my demo" : "Add to my demo";
        b.closest(".mod").classList.toggle("on", on);
      });
      if (countEl) countEl.textContent = p.length === 0 ? "No modules picked yet." : p.length === 1 ? "1 module picked for your demo." : p.length + " modules picked for your demo.";
    }
    modBtns.forEach(function(b){
      b.addEventListener("click", function(){
        if (checks.length){ var c = checks.filter(function(x){ return x.value === b.dataset.see; })[0]; if (c) c.checked = !c.checked; }
        else { var i = mem.indexOf(b.dataset.see); if (i >= 0) mem.splice(i, 1); else mem.push(b.dataset.see); }
        sync();
      });
    });
    checks.forEach(function(c){ c.addEventListener("change", sync); });
    sync();
  })();

  /* ---------- Demo form ---------- */
  (function(){
  if (!$("#demo-form")) return;
  var form = $("#demo-form"), ready = $("#ready"), readyText = $("#ready-text");
  var wa = $("#wa-link"), readyNote = $("#ready-note"), copyBtn = $("#copy-btn"), copyNote = $("#copy-note");
  function val(id){ return document.getElementById(id).value.trim(); }
  function setErr(id, msg){
    var input = document.getElementById("f-" + id), err = document.getElementById("e-" + id);
    if (err) err.textContent = msg || "";
    input.setAttribute("aria-invalid", msg ? "true" : "false");
    return !msg;
  }
  form.addEventListener("submit", function(e){
    e.preventDefault();
    var ok = true, first = null;
    function check(id, cond, msg){ if (!setErr(id, cond ? "" : msg)){ ok = false; if (!first) first = id; } }
    check("name", val("f-name").length > 1, "Please enter your name.");
    check("company", val("f-company").length > 1, "Please enter your company name.");
    check("phone", val("f-phone").replace(/\D/g, "").length >= 10, "Please enter a phone number with at least 10 digits.");
    var em = val("f-email");
    check("email", !em || /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em), "Please check the email address.");
    if (!ok){ document.getElementById("f-" + first).focus(); return; }
    var see = checks.filter(function(c){ return c.checked; }).map(function(c){ return c.value; });
    var msg = [
      "Athena demo request", "",
      "Name: " + val("f-name") + " (" + val("f-role") + ")",
      "Company: " + val("f-company") + (val("f-city") ? ", " + val("f-city") : ""),
      "Manufacturing type: " + val("f-type"),
      "Machines: " + val("f-machines"),
      "Would like to see: " + (see.length ? see.join(", ") : "Everything"),
      "Demo format: " + val("f-mode"),
      "Phone: " + val("f-phone"),
      "Email: " + (em || "Not given"),
      "Biggest challenge: " + (val("f-note") || "Not given")
    ].join("\n");
    readyText.textContent = msg; copyNote.textContent = "";
    if (WHATSAPP_NUMBER){
      wa.href = "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(msg); wa.hidden = false;
      readyNote.textContent = "Tap Send on WhatsApp. Your request reaches us only after you press send in WhatsApp. You can also copy it and email " + CONTACT.email + ".";
    } else {
      wa.hidden = true; readyNote.textContent = "Copy your request and send it to the Athena team.";
    }
    ready.hidden = false;
    ready.scrollIntoView({behavior: reduce ? "auto" : "smooth", block: "nearest"});
  });
  copyBtn.addEventListener("click", function(){
    function selectFallback(){
      var r = document.createRange(); r.selectNodeContents(readyText);
      var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
      copyNote.textContent = "Selected. Press Ctrl+C or long-press to copy.";
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(readyText.textContent).then(function(){ copyNote.textContent = "Copied."; }, selectFallback);
      } else { selectFallback(); }
    } catch(err){ selectFallback(); }
  });
  })();
})();
</script>
